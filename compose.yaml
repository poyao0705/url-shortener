services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD}
      POSTGRES_DB: url_shortener
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s


  redis:
    image: redis:latest
    container_name: my-redis
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis-data:/data
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
      - --appendonly
      - yes
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
    # environment:
    #   - REDIS_ARGS=--requirepass ${REDIS_PASSWORD} --appendonly yes
    restart: unless-stopped

volumes:
  postgres_data:
  redis-data:
